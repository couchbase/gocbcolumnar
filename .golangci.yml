version: "2"
linters:
  enable:
    - err113
    - errorlint
    - exhaustruct_v5
    - gocritic
    - nilnil
    - nlreturn
    - revive
    - wrapcheck
    - wsl_v5
  settings:
    wrapcheck:
      ignore-package-globs:
        - github.com/couchbaselabs/gocbconnstr
        - crypto/x509
      ignore-interface-regexps:
        - analyticsRowReader
        - queryClient
        - clusterClient
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
